/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;
	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);
	background: #fff;
	border-radius: 5px;
	}
.leaflet-touch .leaflet-control-layers-toggle {
	width: 44px;
	height: 44px;
	}
.leaflet-control-layers .leaflet-control-layers-list,
.leaflet-control-layers-expanded .leaflet-control-layers-toggle {
	display: none;
	}
.leaflet-control-layers-expanded .leaflet-control-layers-list {
	display: block;
	position: relative;
	}
.leaflet-control-layers-expanded {
	padding: 6px 10px 6px 6px;
	color: #333;
	background: #fff;
	}
.leaflet-control-layers-scrollbar {
	overflow-y: scroll;
	overflow-x: hidden;
	padding-right: 5px;
	}
.leaflet-control-layers-selector {
	margin-top: 2px;
	position: relative;
	top: 1px;
	}
.leaflet-control-layers label {
	display: block;
	font-size: 13px;
	font-size: 1.08333em;
	}
.leaflet-control-layers-separator {
	height: 0;
	border-top: 1px solid #ddd;
	margin: 5px -10px 5px -6px;
	}

.leaflet-popup {

	margin-top: -1px;

	height: 17px;

}

.leaflet-tooltip-top:before {

:root{
  --bg:#EBF0EF;--card:#FFFFFF;--ink:#142B26;--muted:#475A56;--line:#C9D5D2;
  --glacier:#16657B;--spruce:#1D4A3C;--sign:#1F5B45;--larch:#B47A05;--must:#A8231C;--heads-bg:#F6C431;--nice:#1B5FA8;
  --tab:#FFFFFF;--shadow:0 1px 0 rgba(20,43,38,.08);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#211F1D;--card:#2C2926;--ink:#F0EBE3;--muted:#BDB5AA;--line:#47423C;
  --glacier:#7CCBDF;--spruce:#9AD2BC;--sign:#1F5B45;--larch:#EDB846;--must:#FF9485;--heads-bg:#E9B23A;--nice:#8DBDF2;
  --tab:#282522;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#211F1D;--card:#2C2926;--ink:#F0EBE3;--muted:#BDB5AA;--line:#47423C;
  --glacier:#7CCBDF;--spruce:#9AD2BC;--sign:#1F5B45;--larch:#EDB846;--must:#FF9485;--heads-bg:#E9B23A;--nice:#8DBDF2;
  --tab:#282522;--shadow:none;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overscroll-behavior-y:none}
h1,h2,h3,.disp{font-family:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;font-weight:600;letter-spacing:.005em;line-height:1.1;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--glacier)}
:focus-visible{outline:3px solid var(--larch);outline-offset:2px;border-radius:6px}
.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;position:relative}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 24px}
main[hidden]{display:none}
#view-map{padding:0;overflow:hidden;display:flex;flex-direction:column}
#view-map[hidden]{display:none}

/* tab bar */
.tabs{display:flex;background:var(--tab);border-top:1px solid var(--line);flex:none}
.tabs button{flex:1;min-height:58px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--muted);font-weight:600}
.tabs button svg{width:24px;height:24px;fill:currentColor}
.tabs button[aria-selected="true"]{color:var(--glacier)}
.tabs button[aria-selected="true"] span{border-bottom:2px solid currentColor}

/* day strip: the route as a line of markers */
.strip{display:flex;align-items:center;gap:0;margin:2px 0 12px;position:relative}
.strip::before{content:"";position:absolute;left:4%;right:4%;top:50%;height:3px;background:var(--line);transform:translateY(-50%)}
.strip button{flex:1;position:relative;border:0;background:none;padding:0;min-height:48px;display:flex;align-items:center;justify-content:center}
.strip button i{font-style:normal;font:600 15px/1 "Barlow Condensed","Arial Narrow",sans-serif;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);border:2px solid var(--line);color:var(--muted)}
.strip button.past i{border-color:var(--spruce);color:var(--spruce)}
.strip button.today i{box-shadow:0 0 0 3px var(--larch)}
.strip button[aria-current="true"] i{background:var(--sign);border-color:var(--sign);color:#fff;width:34px;height:34px;font-size:18px}

/* the day header, set like a highway guide sign */
.sign{background:var(--sign);color:#fff;border-radius:14px;padding:5px;margin-bottom:12px}
.sign-in{border:2px solid rgba(255,255,255,.85);border-radius:10px;padding:12px 14px 14px}
.sign .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15px;opacity:.95}
.sign h1{font-size:40px;font-weight:700;margin:4px 0 2px;text-wrap:balance}
.sign .sub{font-size:17px;opacity:.95}
.sign .facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:15px}
.sign .facts b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:19px;font-weight:600;margin-right:4px}
.navrow{display:flex;gap:8px;margin-bottom:12px}
.navrow button{flex:1;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.navrow button:disabled{opacity:.35}
.navrow .gear{flex:none;width:52px;display:flex;align-items:center;justify-content:center}
.navrow .gear svg{width:22px;height:22px;fill:currentColor}

section.block{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
section.block h2{font-size:22px;margin-bottom:8px;color:var(--spruce)}
section.block p{margin:0 0 10px}
section.block p:last-child{margin-bottom:0}
.muted{color:var(--muted);font-size:15px}

/* alerts as road signs */
.alert{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.alert:first-of-type{border-top:0;padding-top:2px}
.alert svg{flex:none;width:34px;height:34px;margin-top:2px}
.alert strong{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:18px;font-weight:600;line-height:1.2}
.alert.must strong{color:var(--must)}.alert.heads strong{color:var(--larch)}.alert.nice strong{color:var(--nice)}

/* weather + daylight */
.wx{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wx>div{border:1px solid var(--line);border-radius:10px;padding:10px}
.wx .t{font:600 26px/1 "Barlow Condensed","Arial Narrow",sans-serif}
.wx .t small{font-size:16px;color:var(--muted);font-weight:600}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.flag{font-size:14px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--heads-bg);color:#1d1a10}
.sun{display:flex;gap:16px;flex-wrap:wrap;font-size:16px}
.sun b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:21px;font-weight:600}

/* stops */
.stop{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.stop:first-of-type{border-top:0}
.stop .ic{flex:none;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.stop .ic svg{width:18px;height:18px;fill:#fff}
.stop .b{flex:1;min-width:0}
.stop .n{font-weight:650}
.go{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--glacier);color:var(--glacier);background:none;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap}
.go.solid{background:var(--glacier);color:var(--card);width:100%;justify-content:center;min-height:50px;font-size:17px;margin-top:6px}
.tag{font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;white-space:nowrap}

/* notes */
textarea,input[type=text],input[type=number],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:96px;resize:vertical}
.who{display:flex;gap:8px;margin:8px 0}
.who button{min-width:56px;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700}
.who button[aria-pressed="true"]{background:var(--sign);color:#fff;border-color:var(--sign)}
.who .save{flex:1;background:var(--glacier);color:var(--card);border-color:var(--glacier)}
.note{border-top:1px solid var(--line);padding:10px 0;white-space:pre-wrap}
.note .m{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.note .m button{border:0;background:none;color:var(--must);min-height:36px;font-size:14px}

/* map */
.mapbar{flex:none;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--bg);scrollbar-width:none}
.mapbar::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:12px;height:12px;border-radius:3px}
#map{flex:1;min-height:0;background:#BFD9E4;position:relative;z-index:0}

.pin{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.pin svg{width:15px;height:15px;fill:#fff;transform:rotate(45deg)}
.plabel{font:600 12px/1 system-ui,sans-serif;color:var(--muted);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg);white-space:nowrap}

.leaflet-container{font:inherit;background:transparent}
.dim{filter:brightness(.62) contrast(1.1) saturate(.7)}
.leaflet-control-attribution{font-size:11px}

/* tips + links */
.tip{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.tip:first-of-type{border-top:0}
.tip::before{content:"";flex:none;width:8px;height:8px;margin-top:9px;border-radius:2px;background:var(--larch);transform:rotate(45deg)}
.linkrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:550}
.linkrow:first-of-type{border-top:0}
.linkrow span:last-child{color:var(--glacier);font-size:14px;font-weight:700;white-space:nowrap}

/* settings */
dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);max-height:88vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{padding:18px 16px 22px}
.dlg h2{font-size:28px;margin-bottom:10px}
.dlg label{display:block;font-weight:600;margin:14px 0 4px;font-size:15px}
.dlg .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dlg .btns button{min-height:48px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600}

<script>/*

(function () { 'use strict';

// shortcuts for easier to read formulas

var PI   = Math.PI,
    sin  = Math.sin,
    cos  = Math.cos,
    tan  = Math.tan,
    asin = Math.asin,
    atan = Math.atan2,
    acos = Math.acos,
    rad  = PI / 180;

var dayMs = 1000 * 60 * 60 * 24,
    J1970 = 2440588,
    J2000 = 2451545;

function toJulian(date) { return date.valueOf() / dayMs - 0.5 + J1970; }
function fromJulian(j)  { return new Date((j + 0.5 - J1970) * dayMs); }
function toDays(date)   { return toJulian(date) - J2000; }


// general calculations for position

var e = rad * 23.4397; // obliquity of the Earth

function rightAscension(l, b) { return atan(sin(l) * cos(e) - tan(b) * sin(e), cos(l)); }
function declination(l, b)    { return asin(sin(b) * cos(e) + cos(b) * sin(e) * sin(l)); }

function azimuth(H, phi, dec)  { return atan(sin(H), cos(H) * sin(phi) - tan(dec) * cos(phi)); }
function altitude(H, phi, dec) { return asin(sin(phi) * sin(dec) + cos(phi) * cos(dec) * cos(H)); }

function siderealTime(d, lw) { return rad * (280.16 + 360.9856235 * d) - lw; }

function astroRefraction(h) {
    if (h < 0) // the following formula works for positive altitudes only.
        h = 0; // if h = -0.08901179 a div/0 would occur.

    // formula 16.4 of "Astronomical Algorithms" 2nd edition by Jean Meeus (Willmann-Bell, Richmond) 1998.
    // 1.02 / tan(h + 10.26 / (h + 5.10)) h in degrees, result in arc minutes -> converted to rad:
    return 0.0002967 / Math.tan(h + 0.00312536 / (h + 0.08901179));

function solarMeanAnomaly(d) { return rad * (357.5291 + 0.98560028 * d); }

function eclipticLongitude(M) {

    var C = rad * (1.9148 * sin(M) + 0.02 * sin(2 * M) + 0.0003 * sin(3 * M)), // equation of center
        P = rad * 102.9372; // perihelion of the Earth

    return M + C + P + PI;

function sunCoords(d) {

    var M = solarMeanAnomaly(d),
        L = eclipticLongitude(M);

    return {
        dec: declination(L, 0),
        ra: rightAscension(L, 0)
    };

var SunCalc = {};


// calculates sun position for a given date and latitude/longitude

SunCalc.getPosition = function (date, lat, lng) {

    var lw  = rad * -lng,
        phi = rad * lat,
        d   = toDays(date),

        c  = sunCoords(d),
        H  = siderealTime(d, lw) - c.ra;

    return {
        azimuth: azimuth(H, phi, c.dec),
        altitude: altitude(H, phi, c.dec)
    };

// sun times configuration (angle, morning name, evening name)

    [  -0.3, 'sunriseEnd',    'sunsetStart' ],
    [    -6, 'dawn',          'dusk'        ],

SunCalc.addTime = function (angle, riseName, setName) {

// calculations for sun times

var J0 = 0.0009;

function julianCycle(d, lw) { return Math.round(d - J0 - lw / (2 * PI)); }

function approxTransit(Ht, lw, n) { return J0 + (Ht + lw) / (2 * PI) + n; }
function solarTransitJ(ds, M, L)  { return J2000 + ds + 0.0053 * sin(M) - 0.0069 * sin(2 * L); }

// returns set time for the given sun altitude
function getSetJ(h, lw, phi, dec, n, M, L) {

    var w = hourAngle(h, phi, dec),

// the observer height (in meters) relative to the horizon

    var lw = rad * -lng,
        phi = rad * lat,

        dh = observerAngle(height),

        d = toDays(date),
        n = julianCycle(d, lw),

        L = eclipticLongitude(M),

        solarNoon: fromJulian(Jnoon),

// moon calculations, based on http://aa.quae.nl/en/reken/hemelpositie.html formulas

function moonCoords(d) { // geocentric ecliptic coordinates of the moon

    var L = rad * (218.316 + 13.176396 * d), // ecliptic longitude
        M = rad * (134.963 + 13.064993 * d), // mean anomaly
        F = rad * (93.272 + 13.229350 * d),  // mean distance

        b  = rad * 5.128 * sin(F),     // latitude

        ra: rightAscension(l, b),
        dec: declination(l, b),
        dist: dt

    var lw  = rad * -lng,
        phi = rad * lat,
        d   = toDays(date),

        c = moonCoords(d),
        H = siderealTime(d, lw) - c.ra,
        h = altitude(H, phi, c.dec),

        azimuth: azimuth(H, phi, c.dec),

        distance: c.dist,
        parallacticAngle: pa

// based on http://idlastro.gsfc.nasa.gov/ftp/pro/astro/mphase.pro formulas and
// Chapter 48 of "Astronomical Algorithms" 2nd edition by Jean Meeus (Willmann-Bell, Richmond) 1998.

SunCalc.getMoonIllumination = function (date) {

        s = sunCoords(d),
        m = moonCoords(d),

                cos(s.dec) * sin(m.dec) * cos(s.ra - m.ra));

        fraction: (1 + cos(inc)) / 2,
        phase: 0.5 + 0.5 * inc * (angle < 0 ? -1 : 1) / Math.PI,
        angle: angle
    };

function hoursLater(date, h) {
    return new Date(date.valueOf() + h * dayMs / 24);

// calculations for moon rise/set times are based on http://www.stargazing.net/kepler/moonrise.html article

SunCalc.getMoonTimes = function (date, lat, lng, inUTC) {
    var t = new Date(date);
    if (inUTC) t.setUTCHours(0, 0, 0, 0);
    else t.setHours(0, 0, 0, 0);

    var hc = 0.133 * rad,
        h0 = SunCalc.getMoonPosition(t, lat, lng).altitude - hc,
        h1, h2, rise, set, a, b, xe, ye, d, roots, x1, x2, dx;

    // go in 2-hour chunks, each time seeing if a 3-point quadratic curve crosses zero (which means rise or set)
    for (var i = 1; i <= 24; i += 2) {
        h1 = SunCalc.getMoonPosition(hoursLater(t, i), lat, lng).altitude - hc;
        h2 = SunCalc.getMoonPosition(hoursLater(t, i + 1), lat, lng).altitude - hc;

        a = (h0 + h2) / 2 - h1;
        b = (h2 - h0) / 2;
        xe = -b / (2 * a);
        ye = (a * xe + b) * xe + h1;
        d = b * b - 4 * a * h1;
        roots = 0;

        if (d >= 0) {
            dx = Math.sqrt(d) / (Math.abs(a) * 2);
            x1 = xe - dx;
            x2 = xe + dx;
            if (Math.abs(x1) <= 1) roots++;
            if (Math.abs(x2) <= 1) roots++;
            if (x1 < -1) x1 = x2;
        }

        if (roots === 1) {
            if (h0 < 0) rise = i + x1;
            else set = i + x1;

        } else if (roots === 2) {
            rise = i + (ye < 0 ? x2 : x1);
            set = i + (ye < 0 ? x1 : x2);
        }

        if (rise && set) break;

        h0 = h2;
    }

    var result = {};

    if (rise) result.rise = hoursLater(t, rise);
    if (set) result.set = hoursLater(t, set);

    if (!rise && !set) result[ye > 0 ? 'alwaysUp' : 'alwaysDown'] = true;

    return result;
};

else if (typeof define === 'function' && define.amd) define(SunCalc);

    { n:2, date:"2026-09-28", type:"local", title:"Kelowna and the Okanagan", sub:"Myra Canyon by bike", drive:"Local", km:35, tz:TZ_P,
      plan:["A relaxed first full day.","Spend your first full day in the Okanagan cycling the historic Kettle Valley Railway through Myra Canyon. The protected section contains trestle bridges and tunnels across a spectacular canyon landscape, while the former railway alignment makes this a scenic, accessible ride rather than a technical mountain-biking day.","Reserve and pick up bikes at Myra Canyon; hire is available at Myra Station. The cycle route is around 3–4 hours with time to stop and explore.","Consider a visit to the winery in the afternoon."],
      overnight:{ name:"Bear Creek Provincial Park", detail:"Second night.", lat:49.929, lng:-119.513, q:"Bear Creek Provincial Park campground, Kelowna BC" },
      high:{ name:"Myra Station", lat:49.800, lng:-119.312, elev:1270 },
      stops:["myra","kelfood"],
      alerts:[
        { l:"heads", t:"The last stretch to Myra Station is a gravel forest service road (about 8 km). Check your rental agreement for unpaved-road rules before taking the motorhome up." },
        { l:"heads", t:"Bike hire at Myra Station winds down in autumn. Reserve, and confirm opening hours for 28 September." },
        { l:"nice", t:"Do the big grocery and propane top-up in Kelowna today. It is the largest town until Calgary." } ] },
    { n:3, date:"2026-09-29", type:"drive", title:"Kelowna to Golden", sub:"Revelstoke and the Glacier corridor", drive:"4½ hours direct; allow 6+ with stops", km:350, tz:TZ_M,
      plan:["Travel north and east into the mountains. Build in a short stop around Revelstoke or Rogers Pass rather than attempting a major hike.","Golden creates a sensible staging night before the Rockies and avoids a very long single transfer from Kelowna to Banff."],
      overnight:{ name:"Golden Municipal Campground", detail:"Request a level, mountain-facing serviced or partial-hook-up pitch.", lat:51.2925, lng:-116.9545, q:"Golden Municipal Campground, Golden BC" },
      high:{ name:"Rogers Pass", lat:51.301, lng:-117.520, elev:1330 },
      stops:["vernon","sicamous","revelstoke","rogers","golden"],
      alerts:[
        { l:"must", t:"Fill up in Revelstoke. There is no fuel for about 150 km until Golden, and no services at Rogers Pass." },
        { l:"heads", t:"Clocks go forward one hour. Golden runs on Mountain Time, so a 17:00 arrival by your Kelowna clock is 18:00 locally. Times on this card are already in Mountain Time." },
        { l:"heads", t:"Expect no mobile signal through most of Rogers Pass and Glacier National Park." },
        { l:"nice", t:"Driving straight through Glacier National Park on Hwy 1 needs no pass. Stopping at a trail or the Rogers Pass Discovery Centre does." } ] },
    { n:4, date:"2026-09-30", type:"drive", title:"Golden to Banff", sub:"Through Yoho National Park", drive:"2 hours direct; use the day for scenic stops", km:160, tz:TZ_M,
      plan:["Enter the Rockies via Yoho National Park. Visit Natural Bridge and Emerald Lake. On the transfer from Golden to Banff, make Emerald Lake the principal active stop. The Emerald Lakeshore trail is an easy 5.2 km loop, estimated by Parks Canada at approximately 2 hours, with continuous lake and mountain views. Pair it with a short stop at Natural Bridge before continuing to Banff.","Takakkaw Falls can be considered only if its access road remains open and your campervan meets any vehicle restrictions. Continue to Banff for a serviced night. No Lake Louise lakeshore stop is included."],
      overnight:{ name:"Tunnel Mountain Trailer Court", detail:"First Banff night; full hook-ups and showers close to town.", lat:51.1905, lng:-115.5275, q:"Tunnel Mountain Trailer Court campground, Banff" },
      high:{ name:"Kicking Horse Pass", lat:51.453, lng:-116.286, elev:1627 },
      stops:["naturalbridge","emerald","takakkaw","field","llfuel"],
      alerts:[
        { l:"must", t:"Parks Canada entry pass needed from today until you leave Banff on Day 9. Campsite reservations do not replace it. Buy online or at the park gate and display it on the dash." },
        { l:"vehicle", place:"takakkaw" },
        { l:"heads", t:"Emerald Lake parking is small and fills by late morning. Arrive early or after 15:00; large-vehicle spaces are limited." },
        { l:"nice", t:"BC’s winter tyre rule starts 1 October. You cross into Alberta today, the day before it applies." } ] },
    { n:5, date:"2026-10-01", type:"drive", title:"Banff to Jasper", sub:"The Icefields Parkway, northbound", drive:"4 hours direct; leave time for stops", km:290, tz:TZ_M,
      plan:["Drive the Icefields Parkway north. Make Bow Lake a priority stop, followed by Peyto Lake if conditions allow.","Make Bow Lake the fixed activity stop on the northbound Icefields Parkway drive. It offers an easy, route-side opportunity to enjoy a glacier-fed lake and mountain panorama without compromising the journey to Jasper. If you make an early start and conditions are clear, Parker Ridge provides the day’s optional proper hike, with elevated views towards the Saskatchewan Glacier.","Continue past the Columbia Icefield and waterfalls towards Jasper. From October onwards, Parks Canada advises that Parkway fuel/services and road maintenance are reduced; fuel before departure, travel in daylight and check road conditions."],
      overnight:{ name:"Whistlers Campground", detail:"Full-service or electrical pitch, close to Jasper.", lat:52.850, lng:-118.078, q:"Whistlers Campground, Jasper National Park" },
      high:{ name:"Bow Summit", lat:51.717, lng:-116.495, elev:2088 },
      stops:["banfffuel","llfuel","bowlake","peyto","crossing","parker","icefield","sunwapta","athabasca","jasper"],
      alerts:[
        { l:"must", t:"Leave with a full fuel tank and full fresh water. Lake Louise is the last reliable fuel for about 230 km. The Crossing resort closes for winter in October: treat its pumps as closed unless you have confirmed otherwise." },
        { l:"must", t:"A valid park pass is required to drive the Parkway. Have it on the dash at the gate north of Lake Louise." },
        { l:"heads", t:"No mobile signal for almost the whole Parkway. Tell someone your plan, and check 511 Alberta and the Parks Canada road report before you lose signal at Lake Louise." },
        { l:"heads", t:"Two passes above 2,000 m (Bow Summit and Sunwapta Pass). Snow and ice are normal in October and the road is not maintained overnight. Drive in daylight only." } ] },
    { n:6, date:"2026-10-02", type:"local", title:"Jasper National Park", sub:"By e-bike to Lake Annette and Lake Edith", drive:"Local", km:0, tz:TZ_M,
      plan:["Use the full Jasper day for cycling rather than moving the campervan between congested lake car parks. Parks Canada identifies a connector trail system linking the town, nearby campgrounds and popular lakes; it also recommends cycling as a practical way to reach Lake Annette and Lake Edith.","Jasper E-Bike Tours and Rentals advertises 2026 rentals by reservation. Hire bikes in Jasper and use connector trails towards Lake Annette and Lake Edith, allowing plenty of time for photo stops and a lakeside picnic."],
      overnight:{ name:"Whistlers Campground", detail:"Second night.", lat:52.850, lng:-118.078, q:"Whistlers Campground, Jasper National Park" },
      high:{ name:"Jasper townsite", lat:52.873, lng:-118.082, elev:1060 },
      stops:["annette","edith","jasper"],
      alerts:[
        { l:"must", t:"08:00 Mountain Time today: Parks Canada releases the remaining 60% of Moraine Lake shuttle seats for Sunday 4 October. If you do not have seats yet, book now while you have signal in Jasper." },
        { l:"heads", t:"Some trails and areas are still closed after the 2024 wildfire. Check the Parks Canada “What’s open” page before setting out." },
        { l:"heads", t:"Elk rut is on. Bulls wander through Whistlers Campground and along the bike trails: keep 30 m away, and carry bear spray on the ride." } ] },
    { n:7, date:"2026-10-03", type:"drive", title:"Jasper to Banff", sub:"The Icefields Parkway, southbound", drive:"4 hours direct", km:290, tz:TZ_M,
      plan:["Return south at an unhurried pace, stopping at viewpoints missed northbound. Keep the itinerary flexible for weather, snow or temporary road restrictions on the Parkway.","After the southbound return from Jasper, use the evening for a warm, restorative soak at Banff Upper Hot Springs. Parks Canada lists the outdoor mineral-water pool as maintained at approximately 37–40 °C and currently open daily from 10:00 to 22:00, with last entry at 21:30; operating hours remain subject to change."],
      overnight:{ name:"Tunnel Mountain Trailer Court", detail:"Second Banff night.", lat:51.1905, lng:-115.5275, q:"Tunnel Mountain Trailer Court campground, Banff" },
      high:{ name:"Sunwapta Pass", lat:52.213, lng:-117.163, elev:2035 },
      stops:["jasper","athabasca","sunwapta","icefield","parker","crossing","peyto","bowlake","llfuel","hotsprings"],
      alerts:[
        { l:"must", t:"Fill up in Jasper and top up fresh water before leaving. Same 230 km gap as Day 5, in reverse; next reliable fuel is Lake Louise." },
        { l:"heads", t:"Same Parkway rules as Day 5: no signal, daylight only, check the road report in Jasper before you go." },
        { l:"nice", t:"Parking at Banff Upper Hot Springs is tight for a motorhome. Roam Transit buses link the campground to town and town to the hot springs." } ] },
    { n:8, date:"2026-10-04", type:"local", title:"Moraine Lake day trip", sub:"Shuttle from the Lake Louise Park and Ride", drive:"About 50 minutes each way", km:120, tz:TZ_M,
      plan:["Drive to the Lake Louise Park and Ride only to board your reserved Parks Canada shuttle to Moraine Lake. Select Moraine Lake as your first destination when booking, visit the Rockpile viewpoint and choose an additional walk only if conditions are suitable. You are not required to use the Lake Connector or visit Lake Louise. Moraine Lake shuttles operate to 12 October 2026, weather permitting.","Complete the headline hike, the Rockpile viewpoint, followed by a longer Larch Valley outing."],
      overnight:{ name:"Tunnel Mountain Trailer Court", detail:"Final Banff night.", lat:51.1905, lng:-115.5275, q:"Tunnel Mountain Trailer Court campground, Banff" },
      high:{ name:"Moraine Lake", lat:51.3217, lng:-116.186, elev:1884 },
      stops:["parkride","moraine"],
      alerts:[
        { l:"must", t:"Shuttle reservation required. Check in at the Park and Ride (1 Whitehorn Road, Lake Louise Ski Resort) inside your one-hour window to collect tickets. Parking there is free." },
        { l:"heads", t:"Larch Valley sits above 2,200 m. Expect snow or ice on the trail in October, and check the trail report for any minimum group size restriction for bears." },
        { l:"heads", t:"Note the time of the last return shuttle from Moraine Lake when you check in (listed as 19:30 this season)." } ] },
    { n:9, date:"2026-10-05", type:"drive", title:"Banff to Kananaskis", sub:"Optional Yamnuska Wolfdog Sanctuary", drive:"3 hours with the sanctuary detour", km:175, tz:TZ_M,
      plan:["Leave Banff and optionally retain the original Wolfdog Sanctuary visit near Cochrane before heading into Kananaskis. A Nordic Spa session remains an optional treat if available. Purchase the Kananaskis Conservation Pass before parking in the area.","Complete an easy walk to Troll Falls, then finish the day with a booked Nordic Spa hydrotherapy session."],
      overnight:{ name:"Mount Kidd RV Park", detail:"Request a serviced site and reconfirm autumn facility provision.", lat:50.8895, lng:-115.1385, q:"Mount Kidd RV Park, Kananaskis" },
      high:{ name:"Kananaskis Village", lat:50.924, lng:-115.146, elev:1500 },
      stops:["canmore","wolfdog","j40fuel","troll","spa"],
      alerts:[
        { l:"must", t:"Kananaskis Conservation Pass: buy online before parking anywhere in Kananaskis. It is registered to the number plate.", plate:true },
        { l:"heads", t:"Fill up in Canmore or at the Hwy 1 / Hwy 40 junction. Assume no fuel in Kananaskis in autumn." },
        { l:"nice", t:"Shop in Canmore rather than Banff: bigger supermarkets, easier motorhome parking." } ] },
    { n:10, date:"2026-10-06", type:"drive", title:"Kananaskis to Calgary", sub:"Return the campervan, fly home", drive:"About 1½ hours plus return procedures", km:125, tz:TZ_M,
      plan:["Leave after breakfast, refuel and complete waste/water requirements in accordance with the campervan agreement. Return the vehicle at Calgary in time for the midday airport plan, allowing time for inspection and any depot-to-terminal transfer."],
      overnight:null,
      high:{ name:"Mount Kidd RV Park", lat:50.8895, lng:-115.1385, elev:1430 },
      stops:["kidddump","calgarydepot","yyc"],
      alerts:[
        { l:"must", t:"Empty grey and black tanks at Mount Kidd before leaving, and refuel within about 10 km of the depot. Check your agreement for the required fuel, propane and water levels." },
        { l:"heads", t:"Check your drop-off time. Indie Campers returns are often due in the morning (08:00–11:00 is typical). Indie does not run an airport shuttle as standard: book a taxi or rideshare from the depot." },
        { l:"nice", t:"Bear spray cannot go on the plane. Hand it to the depot staff or another traveller." } ] }
  ],

  tips: [
    { g:"Driving", items:[
      "Keep the tank above half once you are east of Revelstoke. Mountain gaps are long and autumn closures shorten the list of open stations.",
      "Drive the Icefields Parkway in daylight only. It is not ploughed or patrolled overnight and there is no signal to call for help.",
      "Dawn and dusk are when elk, deer and bears are on the road. Drop your speed, and if one animal crosses expect a second.",
      "Ask at handover which tyres are fitted. BC requires M+S or snowflake tyres on most highways from 1 October; the Icefields Parkway has its own winter tyre dates. Check both if your plans slip.",
      "On long descents (Coquihalla, Kicking Horse, the Big Bend north of the Crossing) shift down and brake in short firm presses rather than riding the pedal.",
      "Know your height and say it out loud before any fuel canopy, drive-through or car park barrier. Enter it in Settings and it shows on every day card.",
      "Wind on the Okanagan Connector and the Parkway can push a Class C sideways. Two hands, and slow down on exposed bridges." ]},
    { g:"Wildlife", items:[
      "Stay 30 m from elk, deer and sheep, and 100 m from bears, wolves and cougars. That is three bus lengths and ten bus lengths.",
      "Carry bear spray on every walk and bike ride, on your belt not in the pack. Rent or buy it in Banff, Canmore or Jasper. It cannot fly home.",
      "Keep a bare campsite: food, coolers, stoves, washing-up bowls and toiletries all go inside the vehicle when you are not using them. Wardens do fine for this.",
      "At a roadside wildlife sighting, stay in the vehicle, pull fully off the road and move on after a minute.",
      "Bull elk in rut charge people and vehicles. Never walk between a bull and his cows, and give them the path even if it means turning back.",
      "Drones are banned in all national parks." ]},
    { g:"Cold nights", items:[
      "Expect lows around or below freezing from Golden onwards. The day cards flag frost when the forecast shows it.",
      "Disconnect the fresh-water hose overnight and run from the tank. A frozen hose splits, and a frozen campground tap is no use in the morning.",
      "Some campground taps and shower blocks close for the season in early October. Fill the tank whenever water is on offer.",
      "Propane runs the heating and the hob. Check the gauge every morning and refill below one third: Kelowna, Golden, Banff, Jasper and Canmore all have it.",
      "Keep an ice scraper, gloves and a head torch in the cab rather than in a rear locker.",
      "Crack a roof vent at night. Two people and a gas heater make a lot of condensation." ]},
    { g:"Motorhome basics", items:[
      "Empty grey and black tanks every two to three days, and always before a Parkway day. Black first, then grey to rinse the hose.",
      "Level the vehicle before bed; the fridge runs better and so do you. Ask for a level pitch when you check in.",
      "Note each campground’s check-in cut-off and gate time. National park kiosks close earlier in October.",
      "Generator quiet hours in national park campgrounds are strict; with hook-ups booked you should not need it.",
      "Before driving off: steps in, vents down, hose and cable stowed, lockers latched, fridge door locked. Walk a full lap of the vehicle every time." ]},
    { g:"Passes and bookings", items:[
      "Parks Canada entry pass: needed from Day 4 (Yoho) to Day 9 (leaving Banff), including the Parkway. Separate from camping fees.",
      "Moraine Lake shuttle: reservation only. The second seat release for 4 October opens at 08:00 MT on 2 October.",
      "Kananaskis Conservation Pass: bought online against the number plate, per day or per vehicle. Needed to park anywhere in Kananaskis, including Troll Falls and the spa.",
      "Emergencies: call 911. With no signal, recent iPhones can text emergency services by satellite in Canada: know how before Day 5." ]}
  ],

<script>(function(){
"use strict";

const qs=new URLSearchParams(location.search);

let wxBlocked=false, cur=0, map=null, mapLayers={}, todayOnly=true, catOn={};

/* ---------- dates ---------- */
function todayStr(){const o=qs.get("date");if(o)return o;return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Edmonton",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}
function dayIndexFor(ds){const i=D.findIndex(d=>d.date===ds);return i}
const fmtDate=d=>new Intl.DateTimeFormat("en-GB",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"}).format(new Date(d+"T12:00:00Z"));
const fmtTime=(t,tz)=>new Intl.DateTimeFormat("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:tz}).format(t);
const dist=km=>S.units==="mi"?Math.round(km*0.621)+" mi":km+" km";
const temp=c=>Math.round(c)+"°";

/* ---------- icons ---------- */
const CAT={camp:["Campsite","#1D4A3C","M12 4 3 20h18L12 4zm0 7 3.5 9h-7L12 11z"],stop:["Stop","#16657B","M12 5a7 7 0 1 0 0 14 7 7 0 0 0 0-14zm0 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"],fuel:["Fuel","#9A6400","M12 3s6 7 6 11a6 6 0 1 1-12 0c0-4 6-11 6-11z"],food:["Groceries","#7A4A22","M5 9h14l-1.5 10h-11L5 9zM9 9l3-5 3 5h-2l-1-2-1 2H9z"],water:["Water","#2475B0","M3 13c3-3 6 3 9 0s6 3 9 0v4c-3 3-6-3-9 0s-6-3-9 0v-4zM3 7c3-3 6 3 9 0s6 3 9 0v3c-3 3-6-3-9 0s-6-3-9 0V7z"],dump:["Dump station","#565D62","M11 4h2v9h3l-4 5-4-5h3V4zM5 19h14v2H5z"],hospital:["Hospital","#A8231C","M10 4h4v6h6v4h-6v6h-4v-6H4v-4h6V4z"]};
const svg=(p,c)=>`<svg viewBox="0 0 24 24" aria-hidden="true"${c?` style="fill:${c}"`:""}><path d="${p}"/></svg>`;
const SIGN={must:`<svg viewBox="0 0 34 34" aria-hidden="true"><path d="M11 2h12l9 9v12l-9 9H11l-9-9V11z" fill="#A8231C" stroke="#fff" stroke-width="1.5"/><path d="M15.5 8h3l-.6 12h-1.8zM17 22.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4z" fill="#fff"/></svg>`,
heads:`<svg viewBox="0 0 34 34" aria-hidden="true"><path d="M17 1.5 32.5 17 17 32.5 1.5 17z" fill="#F6C431" stroke="#1d1a10" stroke-width="1.5" stroke-linejoin="round"/><path d="M15.7 9h2.6l-.5 10h-1.6zM17 21.3a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6z" fill="#1d1a10"/></svg>`,
nice:`<svg viewBox="0 0 34 34" aria-hidden="true"><rect x="2" y="2" width="30" height="30" rx="5" fill="#1B5FA8" stroke="#fff" stroke-width="1.5"/><path d="M17 8a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm-2.5 6.5h4V24H21v2h-7v-2h2v-7.5h-1.5z" fill="#fff"/></svg>`};
const LEVEL={must:"Must do",heads:"Heads up",nice:"Nice to know"};

/* ---------- map links ---------- */
function mapsUrl(p){const q=encodeURIComponent(p.q||p.name);return IOS?`https://maps.apple.com/?q=${q}&sll=${p.lat},${p.lng}`:`https://www.google.com/maps/search/?api=1&query=${q}`}
function dirUrl(d){const prev=D[d.n-2];const from=prev&&prev.overnight?prev.overnight:TRIP.pins[d.stops[0]];const to=d.overnight||TRIP.pins[d.stops[d.stops.length-1]];
  const o=encodeURIComponent(from.q||from.name), t=encodeURIComponent(to.q||to.name);
  return IOS?`https://maps.apple.com/?saddr=${o}&daddr=${t}&dirflg=d`:`https://www.google.com/maps/dir/?api=1&origin=${o}&destination=${t}&travelmode=driving`}

/* ---------- today ---------- */
function alertHtml(a,d){
  if(a.l==="vehicle"){const p=TRIP.pins[a.place];const over=S.lengthM>p.maxLengthM;
    return alertHtml({l:over?"must":"nice",t:over?`${p.name}: likely not suitable. Your vehicle length is set to ${S.lengthM} m and the road’s switchbacks need vehicles over ${p.maxLengthM} m to reverse round them. Skip it unless Indie Campers confirm a shorter length. The road also shuts for the season in early to mid October.`:`${p.name}: your vehicle length (${S.lengthM} m) is within the ${p.maxLengthM} m guidance for Yoho Valley Road. Check the road is still open for the season at the Field visitor centre.`},d)}
  let t=esc(a.t);if(a.plate&&!FAMILY)t+=S.plate?` Your plate: <b>${esc(S.plate)}</b>.`:` Add the plate in Settings at pick-up so it is to hand.`;
  return `<div class="alert ${a.l}">${SIGN[a.l]}<div><strong>${LEVEL[a.l]}</strong>${t}</div></div>`}
function sunHtml(d){const at=d.overnight||d.high;const t=SunCalc.getTimes(new Date(d.date+"T19:00:00Z"),at.lat,at.lng);
  const park=new Date(t.sunset.getTime()-30*60000);const tzn=d.tz===TZ_P?"Pacific":"Mountain";
  return `<div class="sun"><span>Sunrise <b>${fmtTime(t.sunrise,d.tz)}</b></span><span>Sunset <b>${fmtTime(t.sunset,d.tz)}</b></span><span>Last light <b>${fmtTime(t.dusk,d.tz)}</b></span></div><p class="muted" style="margin-top:6px">${d.type==="drive"?`Be parked by <b>${fmtTime(park,d.tz)}</b>. `:""}${tzn} Time, at ${esc(at.name)}.</p>`}
function wxHtml(d){
  if(!wx||!wx.data)return `<p class="muted">${wxBlocked?"Live weather could not be reached from this copy of the app. It works on the hosted version.":"No forecast saved yet. It loads when you open the app with a connection."}</p>`;
  const [a,b]=TRIP.wxDay[d.n];const cell=i=>{const p=wx.data[i];if(!p)return null;const k=p.time.indexOf(d.date);if(k<0)return null;return {name:TRIP.wx[i][0],hi:p.hi[k],lo:p.lo[k],pr:p.pr[k],sn:p.sn[k],wi:p.wi[k]}};
  const A=cell(a),B=a===b?null:cell(b);
  if(!A)return `<p class="muted">The forecast does not reach ${fmtDate(d.date)} yet. Forecasts run about two weeks ahead.</p>`;
  const box=c=>`<div><div class="muted">${esc(c.name)}</div><div class="t">${temp(c.hi)} <small>/ ${temp(c.lo)}</small></div><div class="muted">${c.sn>0?`Snow ${c.sn.toFixed(1)} cm`:c.pr>0.2?`Rain ${c.pr.toFixed(1)} mm`:"Dry"}, wind ${Math.round(c.wi)} km/h</div></div>`;
  const flags=[];if(A.lo<=0)flags.push("Frost tonight");if((B&&B.sn>0)||A.sn>0)flags.push("Snow on route");if(Math.max(A.wi,B?B.wi:0)>=45)flags.push("Strong wind");
  const age=new Date(wx.at);const stale=!navigator.onLine||Date.now()-wx.at>3*3600e3;
  return `<div class="wx">${box(A)}${B?box(B):""}</div>${flags.length?`<div class="flags">${flags.map(f=>`<span class="flag">${f}</span>`).join("")}</div>`:""}<p class="muted" style="margin-top:8px">${stale?"Saved forecast, ":"Forecast "}updated ${new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(age)}. Source: Open-Meteo.</p>`}
function stopHtml(id){const p=TRIP.pins[id];if(!p)return"";const c=CAT[p.cat];
  return `<div class="stop"><span class="ic" style="background:${c[1]}">${svg(c[2])}</span><div class="b"><div class="n">${esc(p.name)}${p.seasonal?'<span class="tag">Seasonal</span>':""}${p.approx?'<span class="tag">Pin approximate</span>':""}</div><div class="muted">${esc(p.note)}${p.src?` <a href="${p.src}" target="_blank" rel="noopener">Source</a>`:""}</div></div><a class="go" href="${mapsUrl(p)}" target="_blank" rel="noopener" aria-label="Open ${esc(p.name)} in maps">Open in maps</a></div>`}
function notesHtml(d){if(FAMILY)return"";const list=notes.filter(n=>n.day===d.n).sort((a,b)=>b.ts-a.ts);
  return `<section class="block"><h2>Notes</h2><label class="muted" for="note">Jot anything for Day ${d.n}. Saved on this phone only.</label><textarea id="note" placeholder="Where you parked, what you’d do again, what the elk did…">${esc(store.get("draft"+d.n,""))}</textarea>
  <div class="who"><button data-who="J" aria-pressed="${who==="J"}">J</button><button data-who="E" aria-pressed="${who==="E"}">E</button><button class="save" id="saveNote">Save note</button></div>
  ${list.map(n=>`<div class="note"><div class="m"><span>${esc(n.who)}, ${new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(new Date(n.ts))}</span><button data-del="${n.id}">Delete</button></div>${esc(n.text)}</div>`).join("")}</section>`}
function renderToday(){
  const d=D[cur], ts=todayStr(), ti=dayIndexFor(ts);
  let banner="";
  if(ts<TRIP.start){const n=Math.round((Date.parse(TRIP.start)-Date.parse(ts))/864e5);banner=`<div class="banner"><span class="count">${n} day${n===1?"":"s"}</span> until you collect the campervan. Open this once on wifi on each phone before you go.</div>`}
  else if(ts>TRIP.end)banner=`<div class="banner">The trip has finished. Swipe through the days, or open the Map for the whole route.</div>`;
  const supplies=[...d.stops,...(TRIP.extra[d.n]||[])].filter((v,i,a)=>a.indexOf(v)===i);
  const stops=supplies.filter(id=>["stop"].includes(TRIP.pins[id].cat)), serv=supplies.filter(id=>!["stop","camp"].includes(TRIP.pins[id].cat));
  $("#view-today").innerHTML=`
  <nav class="strip" aria-label="Days">${D.map((x,i)=>`<button class="${i<ti||ts>TRIP.end?"past":""} ${i===ti?"today":""}" aria-current="${i===cur}" aria-label="Day ${x.n}, ${fmtDate(x.date)}" data-day="${i}"><i>${x.n}</i></button>`).join("")}</nav>
  ${banner}
  <header class="sign"><div class="sign-in"><div class="row"><span>Day ${d.n} of 10${cur===ti?", today":""}</span><span>${fmtDate(d.date)}</span></div>
    <h1>${esc(d.title)}</h1><div class="sub">${esc(d.sub)}</div>
    <div class="facts"><span><b>${esc(d.drive)}</b></span>${d.km?`<span><b>${dist(d.km)}</b>approx.</span>`:""}<span><b>${d.high.elev.toLocaleString()} m</b>${esc(d.high.name)}</span></div></div></header>
  <div class="navrow"><button id="prev" ${cur===0?"disabled":""}>Previous day</button><button id="next" ${cur===D.length-1?"disabled":""}>Next day</button>${FAMILY?"":`<button class="gear" id="gear" aria-label="Settings">${svg("M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z")}</button>`}</div>
  <section class="block"><h2>Before you set off</h2>${d.alerts.map(a=>alertHtml(a,d)).join("")}</section>
  <section class="block"><h2>Daylight</h2>${sunHtml(d)}</section>
  <section class="block"><h2>Weather</h2>${wxHtml(d)}</section>
  <section class="block"><h2>The plan</h2>${d.plan.map(p=>`<p>${esc(p)}</p>`).join("")}${d.type==="drive"||d.n===8?`<a class="go solid" href="${dirUrl(d)}" target="_blank" rel="noopener">Directions for today’s drive</a>`:""}</section>
  ${stops.length?`<section class="block"><h2>Stops</h2>${stops.map(stopHtml).join("")}</section>`:""}
  ${d.overnight?`<section class="block"><h2>Tonight</h2><div class="stop"><span class="ic" style="background:${CAT.camp[1]}">${svg(CAT.camp[2])}</span><div class="b"><div class="n">${esc(d.overnight.name)}</div><div class="muted">${esc(d.overnight.detail)}</div></div><a class="go" href="${mapsUrl(d.overnight)}" target="_blank" rel="noopener" aria-label="Open ${esc(d.overnight.name)} in maps">Open in maps</a></div></section>`:""}
  ${serv.length?`<section class="block"><h2>Fuel, food and services</h2>${serv.map(stopHtml).join("")}<p class="muted" style="margin-top:8px">Places checked ${CHECKED}. Opening seasons change in October: confirm anything marked seasonal.</p></section>`:""}
  ${notesHtml(d)}`;
  $("#view-today").scrollTop=0;
}
function go(i){if(i<0||i>=D.length)return;saveDraft();cur=i;renderToday();if(map)drawMap()}
function saveDraft(){const t=$("#note");if(t)store.set("draft"+D[cur].n,t.value)}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2600)}

/* ---------- weather ---------- */
async function loadWx(){
  if(!navigator.onLine)return; if(wx&&Date.now()-wx.at<2*3600e3)return;
  try{const la=TRIP.wx.map(p=>p[1]).join(","),lo=TRIP.wx.map(p=>p[2]).join(",");
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum,wind_speed_10m_max&timezone=America%2FEdmonton&forecast_days=16`);
    if(!r.ok)return;let j=await r.json();if(!Array.isArray(j))j=[j];
    wx={at:Date.now(),data:j.map(p=>({time:p.daily.time,hi:p.daily.temperature_2m_max,lo:p.daily.temperature_2m_min,pr:p.daily.precipitation_sum,sn:p.daily.snowfall_sum,wi:p.daily.wind_speed_10m_max}))};
    store.set("wx",wx);renderTodayKeepScroll()}catch(e){if(navigator.onLine&&!wx){wxBlocked=true;renderTodayKeepScroll()}}}
function renderTodayKeepScroll(){const v=$("#view-today"),y=v.scrollTop,t=$("#note"),val=t&&t.value,foc=document.activeElement===t;renderToday();v.scrollTop=y;if(val!=null&&$("#note")){$("#note").value=val;if(foc)$("#note").focus()}}

/* ---------- road-accurate route lines (fetched once when online) ---------- */
function havKm(a,b){const R=6371,t=x=>x*Math.PI/180,dl=t(b[0]-a[0]),dn=t(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
async function refineRoutes(){
  if(!navigator.onLine||location.protocol==="file:")return;
  const via={1:[[49.38,-121.441],[50.112,-120.789]],3:[[50.267,-119.272],[50.836,-118.977],[50.998,-118.195]],4:[[51.397,-116.49]],5:[[51.425,-116.179],[51.972,-116.725]],7:[[51.972,-116.725],[51.425,-116.179]],9:[[51.089,-115.359]],10:[]};
  for(const k of Object.keys(via)){ if(osrm[k])continue;
    const r=ROUTES[k],pts=[r[0],...via[k],r[r.length-1]];
    try{const res=await fetch(`https://router.project-osrm.org/route/v1/driving/${pts.map(p=>p[1]+","+p[0]).join(";")}?overview=simplified&geometries=geojson`);
      if(!res.ok)continue;const j=await res.json();const g=j.routes&&j.routes[0];if(!g)continue;
      let base=0;for(let i=1;i<r.length;i++)base+=havKm(r[i-1],r[i]);const km=g.distance/1000;
      if(km<base*0.85||km>base*1.45)continue; /* reject odd detours, keep bundled line */
      osrm[k]=g.geometry.coordinates.map(c=>[+c[1].toFixed(4),+c[0].toFixed(4)]);store.set("routes",osrm);if(map)drawMap();
    }catch(e){return}}
}
const routeFor=k=>osrm[k]&&!(k==4||k==9)?osrm[k]:ROUTES[k]; /* days 4 and 9 keep their side-trips */

/* ---------- where am I (GPS works with no signal) ---------- */
const loc={watch:null,dot:null,ring:null,follow:false,first:true,last:null};
function locate(){
  if(!("geolocation" in navigator))return toast("This browser cannot share your location");
  if(loc.watch!=null&&loc.last){loc.follow=true;map.setView(loc.last,Math.max(map.getZoom(),11));return distToast()}
  if(loc.watch!=null)return toast("Still finding you. GPS can take a minute outdoors");
  toast("Finding you…");loc.first=true;
  loc.watch=navigator.geolocation.watchPosition(pos=>{
    const ll=[pos.coords.latitude,pos.coords.longitude],acc=pos.coords.accuracy||0;loc.last=ll;
    if(!loc.dot){loc.ring=L.circle(ll,{radius:acc,color:"#2475B0",weight:1,fillColor:"#2475B0",fillOpacity:.15,interactive:false}).addTo(map);
      loc.dot=L.marker(ll,{interactive:false,keyboard:false,zIndexOffset:1000,icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map)}
    else{loc.dot.setLatLng(ll);loc.ring.setLatLng(ll).setRadius(acc)}
    $("#locbtn").setAttribute("aria-pressed","true");
    if(loc.first){loc.first=false;loc.follow=true;
      const inside=ll[0]>47.5&&ll[0]<54.5&&ll[1]>-126&&ll[1]<-111;
      if(inside){map.setView(ll,Math.max(map.getZoom(),11));distToast()}else toast("You are outside the trip area, so the map stays on the route")}
    else if(loc.follow)map.panTo(ll);
  },err=>{stopLocate();toast(err.code===1?"Location is blocked. Allow it for this site in your browser settings":err.code===3?"No GPS fix yet. Try again outdoors or near a window":"Location is not available here")},{enableHighAccuracy:true,maximumAge:15000,timeout:60000});
}
function stopLocate(){if(loc.watch!=null)navigator.geolocation.clearWatch(loc.watch);loc.watch=null;const b=$("#locbtn");if(b)b.setAttribute("aria-pressed","false")}
function distToast(){const d=D[cur],to=d.overnight||TRIP.pins[d.stops[d.stops.length-1]];if(!loc.last||!to)return;const km=havKm(loc.last,[to.lat,to.lng]);toast(`${km<10?km.toFixed(1):Math.round(km)} km in a straight line to ${to.name}`.replace(/^([\d.]+) km/,(m,n)=>S.units==="mi"?(n*0.621).toFixed(n<10?1:0)+" mi":m))}

/* ---------- map ---------- */
const DAYCOL=["#16657B","#B47A05","#1D4A3C","#A8231C","#2475B0","#7A4A22","#6B4FA0","#C4501B","#0F7D6B","#565D62"];
function initMap(){
  if(map)return;
  map=L.map("map",{zoomControl:false,attributionControl:true,minZoom:5,maxZoom:16,zoomSnap:0.25,preferCanvas:true,maxBounds:[[47.5,-126],[54.5,-111]]});
  L.control.zoom({position:"topright"}).addTo(map);
  map.attributionControl.setPrefix(false).addAttribution("Base: Natural Earth");
  const bp=map.createPane("base");bp.style.zIndex=150;const lp=map.createPane("blabels");lp.style.zIndex=160;lp.style.pointerEvents="none";
  const cv=L.canvas({pane:"base"});const dark=getComputedStyle(document.documentElement).colorScheme.trim()==="dark";$("#map").style.background=dark?"#2b302c":"#E6EBE4";mapLayers.dark=dark;
  const col=dark?{land:"#2b302c",lake:"#1c2a30",river:"#34505c",road:"#6b665d",road2:"#4d4a44",border:"#555"}:{land:"#E6EBE4",lake:"#BFD9E4",river:"#A9CBDA",road:"#B9A98A",road2:"#CFC6B3",border:"#9aa"};
  const gj=(arr,style)=>L.geoJSON({type:"FeatureCollection",features:arr.map(f=>({type:"Feature",geometry:f.g,properties:f.p||{}}))},{renderer:cv,pane:"base",interactive:false,style});
  gj(BASE.ocean,{stroke:false,fillColor:col.lake,fillOpacity:1}).addTo(map);
  gj(BASE.rivers,{color:col.river,weight:1.2}).addTo(map);
  gj(BASE.lakes,{stroke:false,fillColor:col.lake,fillOpacity:1}).addTo(map);
  gj(BASE.borders,{color:col.border,weight:1,dashArray:"6 4"}).addTo(map);
  gj(BASE.roads,f=>({color:f.properties.t==="Major Highway"?col.road:col.road2,weight:f.properties.t==="Major Highway"?2.2:1.2})).addTo(map);
  BASE.places.forEach(p=>L.marker([p.c[1],p.c[0]],{pane:"blabels",interactive:false,keyboard:false,icon:L.divIcon({className:"plabel",html:esc(p.n),iconSize:[0,0],iconAnchor:[-5,6]})}).addTo(map));
  if(navigator.onLine){const tl=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:16,attribution:"© OpenStreetMap",className:dark?"dim":""});tl.addTo(map)}
  mapLayers.routes=L.layerGroup().addTo(map);mapLayers.pins=L.layerGroup().addTo(map);
  const LC=L.Control.extend({options:{position:"topright"},onAdd(){const b=L.DomUtil.create("button","locbtn");b.type="button";b.id="locbtn";b.setAttribute("aria-label","Show where I am");b.setAttribute("aria-pressed","false");b.innerHTML=svg("M11 2h2v3.1A7 7 0 0 1 18.9 11H22v2h-3.1A7 7 0 0 1 13 18.9V22h-2v-3.1A7 7 0 0 1 5.1 13H2v-2h3.1A7 7 0 0 1 11 5.1V2zm1 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4z");L.DomEvent.disableClickPropagation(b);L.DomEvent.on(b,"click",locate);return b}});
  map.addControl(new LC());
  map.on("dragstart",()=>{loc.follow=false});
  map.on("click",()=>closeSheet());
  drawMap(true);
}
function dayPins(n){const d=D[n-1];const ids=[...d.stops,...(TRIP.extra[n]||[])];return ids.filter((v,i,a)=>a.indexOf(v)===i)}
function drawMap(fit){
  mapLayers.routes.clearLayers();mapLayers.pins.clearLayers();
  const days=todayOnly?[D[cur].n]:D.map(d=>d.n);
  D.forEach(d=>{const on=days.includes(d.n);if(!on&&todayOnly){L.polyline(routeFor(d.n),{color:"#7d8a87",weight:3,opacity:.45,interactive:false}).addTo(mapLayers.routes);return}
    L.polyline(routeFor(d.n),{color:mapLayers.dark?"#0e1412":"#fff",weight:8,opacity:.9,interactive:false}).addTo(mapLayers.routes);
    L.polyline(routeFor(d.n),{color:todayOnly?(mapLayers.dark?"#7CCBDF":"#16657B"):DAYCOL[d.n-1],weight:4.5,opacity:1,interactive:false,dashArray:d.n===7?"10 8":null}).addTo(mapLayers.routes)});
  const ids=[...new Set(days.flatMap(dayPins))];const list=[];
  ids.forEach(id=>{const p=TRIP.pins[id];if(catOn[p.cat]===false)return;const c=CAT[p.cat];list.push(id);
    L.marker([p.lat,p.lng],{title:p.name,alt:c[0]+": "+p.name,icon:L.divIcon({className:"",html:`<div class="pin" style="background:${c[1]}">${svg(c[2])}</div>`,iconSize:[30,30],iconAnchor:[15,30]})}).on("click",e=>{L.DomEvent.stopPropagation(e);openSheet(id)}).addTo(mapLayers.pins)});
  $("#maplist").innerHTML=list.map(stopHtml).join("")||`<p class="muted" style="padding:12px 0">No places match these filters.</p>`;
  $("#mapday").textContent=todayOnly?`Day ${D[cur].n} only`:"All 10 days";
  if(fit!==false){const pts=todayOnly?routeFor(D[cur].n):D.flatMap(d=>routeFor(d.n));map.fitBounds(L.latLngBounds(pts).pad(.12),{animate:false})}
}
function openSheet(id){const p=TRIP.pins[id],c=CAT[p.cat];const sh=$("#sheet");
  sh.innerHTML=`<button class="x" aria-label="Close">×</button><div class="muted">${c[0]}${p.seasonal?", seasonal":""}${p.approx?", pin position approximate":""}</div><h3>${esc(p.name)}</h3><p style="margin:8px 0 4px">${esc(p.note)}</p><a class="go solid" href="${mapsUrl(p)}" target="_blank" rel="noopener">Open in maps</a>`;
  sh.classList.add("open");$(".x",sh).onclick=closeSheet;$(".x",sh).focus()}
function closeSheet(){$("#sheet").classList.remove("open")}
function renderMapBar(){
  $("#mapbar").innerHTML=`<button class="chip" id="mapday" aria-pressed="${todayOnly}"></button>`+Object.keys(CAT).map(k=>`<button class="chip" data-cat="${k}" aria-pressed="${catOn[k]!==false}"><span class="dot" style="background:${CAT[k][1]}"></span>${CAT[k][0]}</button>`).join("")+`<button class="chip" id="listtoggle" aria-pressed="false">Show as list</button>`}

/* ---------- tips, links ---------- */
function renderTips(){$("#view-tips").innerHTML=`<h1 class="disp" style="font-size:34px;margin:6px 0 12px">Late-season tips</h1>`+TRIP.tips.map(g=>`<section class="block"><h2>${g.g}</h2>${g.items.map(t=>`<div class="tip"><div>${esc(t)}</div></div>`).join("")}</section>`).join("")+`<p class="muted">General guidance checked ${CHECKED}. Park rules and closures change: the Links tab has the official pages.</p>`}
function renderLinks(){$("#view-links").innerHTML=`<h1 class="disp" style="font-size:34px;margin:6px 0 4px">Live conditions</h1><p class="muted" style="margin:0 0 12px">These open in your browser and need a connection. Check them the evening before a driving day.</p>`+TRIP.links.map(g=>`<section class="block"><h2>${g.g}</h2>${g.items.map(l=>`<a class="linkrow" href="${l[1]}" target="_blank" rel="noopener"><span>${esc(l[0])}</span><span>Open</span></a>`).join("")}</section>`).join("")}

/* ---------- settings ---------- */
function applyTheme(){const r=document.documentElement;if(S.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.theme)}
function offlineStatus(){const el=$("#offstat");if(!el)return;
  if(!("serviceWorker" in navigator)||!window.__sw){el.className="status";el.textContent="This copy is a preview and needs a connection to open. Offline use works on the hosted version, once it is added to your home screen.";return}
  el.className="status ok";el.textContent="Ready for offline. Everything except live weather and the detailed street layer is saved on this phone."}
function openSettings(){
  const dlg=$("#settings");dlg.innerHTML=`<div class="dlg"><h2>Settings</h2>
  <p class="muted">${esc(TRIP.vehicle.name)}. Enter the real figures from the handover sheet; the app uses them for road warnings.</p>
  <div class="two"><div><label for="sl">Vehicle length (m)</label><input id="sl" type="number" step="0.1" inputmode="decimal" value="${S.lengthM}"></div><div><label for="sh">Vehicle height (m)</label><input id="sh" type="number" step="0.1" inputmode="decimal" value="${S.heightM}"></div></div>
  <label for="sp">Number plate (for the Kananaskis pass)</label><input id="sp" type="text" autocapitalize="characters" value="${esc(S.plate)}">
  <div class="two"><div><label for="su">Distances</label><select id="su"><option value="km">Kilometres</option><option value="mi">Miles</option></select></div><div><label for="st">Appearance</label><select id="st"><option value="auto">Match phone</option><option value="light">Light</option><option value="dark">Dark</option></select></div></div>
  <label>Offline</label><div id="offstat" class="status"></div><div class="btns"><button id="redl">Re-download the app</button></div>
  <label>Notes</label><div class="btns"><button id="exp">Export notes</button><button id="imp">Import notes</button></div><textarea id="impbox" hidden placeholder="Paste exported notes here, then press Import notes again"></textarea>
  <label>Share with family</label><p class="muted">Send them this link. They see the route and days, not your notes or vehicle details.</p><div class="btns"><button id="fam">Copy family link</button></div>
  <div class="btns" style="margin-top:18px"><button id="done" style="flex:1;background:var(--glacier);color:var(--card);border-color:var(--glacier)">Done</button></div></div>`;
  $("#su").value=S.units;$("#st").value=S.theme;offlineStatus();dlg.showModal();
  const save=()=>{S.lengthM=parseFloat($("#sl").value)||S.lengthM;S.heightM=parseFloat($("#sh").value)||S.heightM;S.plate=$("#sp").value.trim().toUpperCase();S.units=$("#su").value;S.theme=$("#st").value;store.set("settings",S);applyTheme()};
  dlg.oninput=save;dlg.onchange=save;
  $("#done").onclick=()=>{save();dlg.close();renderToday()};
  $("#fam").onclick=()=>copy(location.origin+location.pathname+"?view=family","Family link copied");
  $("#redl").onclick=async()=>{try{if(window.caches){for(const k of await caches.keys())if(k.startsWith("ca26-app"))await caches.delete(k)}const r=await navigator.serviceWorker.getRegistration();if(r)await r.update()}catch(e){}location.reload()};
  $("#exp").onclick=exportNotes;$("#imp").onclick=importNotes;
}
async function copy(t,msg){try{await navigator.clipboard.writeText(t);toast(msg)}catch(e){prompt("Copy this:",t)}}
async function exportNotes(){
  const text=D.map(d=>{const l=notes.filter(n=>n.day===d.n).sort((a,b)=>a.ts-b.ts);return l.length?`Day ${d.n}, ${fmtDate(d.date)}: ${d.title}\n`+l.map(n=>`  [${n.who}] ${n.text}`).join("\n"):""}).filter(Boolean).join("\n\n");
  const payload=JSON.stringify({app:"ca26-notes",v:1,notes});
  if(!notes.length){toast("No notes to export yet");return}
  try{const f=new File([payload],"canada-notes.json",{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Canada trip notes",text});return}}catch(e){if(e&&e.name==="AbortError")return}
  await copy(payload,"Notes copied. Paste them into Import on the other phone");
}
function mergeNotes(j){const inc=(j&&j.notes)||[];const have=new Set(notes.map(n=>n.id));let add=0;inc.forEach(n=>{if(n&&n.id&&!have.has(n.id)&&n.text){notes.push({id:n.id,day:+n.day,who:String(n.who||"?").slice(0,2),ts:+n.ts,text:String(n.text)});add++}});store.set("notes",notes);return add}
function importNotes(){const b=$("#impbox");if(b.hidden){b.hidden=false;b.focus();return}try{const n=mergeNotes(JSON.parse(b.value));b.value="";b.hidden=true;toast(n?`${n} note${n===1?"":"s"} added`:"Nothing new to add")}catch(e){toast("That does not look like exported notes")}}

/* ---------- events ---------- */
function showTab(t){saveDraft();$$("main").forEach(m=>m.hidden=m.id!=="view-"+t);$$(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  if(t!=="map"&&loc.watch!=null){stopLocate()}
  if(t==="map"){initMap();setTimeout(()=>{map.invalidateSize();drawMap()},30)}}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab)return showTab(b.dataset.tab);
  if(b.dataset.day!=null)return go(+b.dataset.day);
  if(b.id==="prev")return go(cur-1); if(b.id==="next")return go(cur+1); if(b.id==="gear")return openSettings();
  if(b.dataset.who){who=b.dataset.who;store.set("who",who);$$("[data-who]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.who===who));return}
  if(b.id==="saveNote"){const t=$("#note").value.trim();if(!t)return toast("Write something first");notes.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),day:D[cur].n,who,ts:Date.now(),text:t});if(!store.set("notes",notes))return toast("Could not save: storage is full or blocked");store.set("draft"+D[cur].n,"");renderTodayKeepScroll();$("#note").value="";return toast("Note saved")}
  if(b.dataset.del){if(confirm("Delete this note?")){notes=notes.filter(n=>n.id!==b.dataset.del);store.set("notes",notes);renderTodayKeepScroll()}return}
  if(b.id==="mapday"){todayOnly=!todayOnly;b.setAttribute("aria-pressed",todayOnly);return drawMap()}
  if(b.dataset.cat){const k=b.dataset.cat;catOn[k]=catOn[k]===false;b.setAttribute("aria-pressed",catOn[k]!==false);return drawMap(false)}
  if(b.id==="listtoggle"){const l=$("#maplist");l.hidden=!l.hidden;b.setAttribute("aria-pressed",!l.hidden);setTimeout(()=>map.invalidateSize(),30);return}
});
document.addEventListener("input",e=>{if(e.target.id==="note")store.set("draft"+D[cur].n,e.target.value)});
let sx=0,sy=0;const vt=$("#view-today");
vt.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
vt.addEventListener("touchend",e=>{if(e.target.closest("textarea,.strip"))return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2)go(cur+(dx<0?1:-1))},{passive:true});
document.addEventListener("keydown",e=>{if(e.target.matches("textarea,input,select"))return;if(!$("#view-today").hidden){if(e.key==="ArrowLeft")go(cur-1);if(e.key==="ArrowRight")go(cur+1)}});
window.addEventListener("online",()=>{loadWx();refineRoutes()});

/* ---------- start ---------- */
applyTheme();
if(FAMILY)document.documentElement.classList.add("family");
const ti=dayIndexFor(todayStr());cur=ti>=0?ti:0;
renderToday();renderTips();renderLinks();renderMapBar();
if(todayStr()>TRIP.end){todayOnly=false}
loadWx();setTimeout(refineRoutes,1500);
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(()=>{window.__sw=true;if(!store.get("swtoast")){toast("Ready for offline");store.set("swtoast",1)}offlineStatus()}).catch(()=>{})}
})();
</script>
</body>
</html>
